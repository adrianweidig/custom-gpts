<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">CustomGPTs repository overview</title>
  <desc id="desc">A clean repository hero showing seven curated Custom GPT artifact areas connected around a central documentation hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#12313b"/>
      <stop offset="1" stop-color="#263319"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <path d="M0 342 C210 284 376 382 575 310 C780 236 937 290 1280 206 L1280 420 L0 420 Z" fill="#f8fafc" opacity="0.08"/>
  <path d="M84 94 H1196" stroke="#94a3b8" stroke-opacity="0.25"/>
  <text x="84" y="76" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="0">Curated prompt artifacts</text>
  <text x="84" y="158" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="0">CustomGPTs</text>
  <text x="88" y="204" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" letter-spacing="0">Systemprompts, Fachwissen, Bootloader und Konfigurationsdokumentation für öffentliche Custom GPTs.</text>
  <g filter="url(#shadow)">
    <rect x="84" y="252" width="340" height="74" rx="16" fill="#f8fafc"/>
    <text x="112" y="284" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Dokumentation zuerst</text>
    <text x="112" y="311" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">README, Security, Support, Contribution</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="456" y="252" width="280" height="74" rx="16" fill="#f8fafc"/>
    <text x="484" y="284" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">GPT-Pakete</text>
    <text x="484" y="311" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">PromptForge, OpenWebUI, n8n und mehr</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="768" y="252" width="344" height="74" rx="16" fill="#f8fafc"/>
    <text x="796" y="284" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Kollaborationsbereit</text>
    <text x="796" y="311" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Issue-Templates, PR-Prozess, Health-Checks</text>
  </g>
  <rect x="84" y="356" width="436" height="8" rx="4" fill="url(#accent)"/>
  <circle cx="1130" cy="118" r="54" fill="#5eead4" opacity="0.16"/>
  <circle cx="1188" cy="172" r="38" fill="#bef264" opacity="0.18"/>
</svg>
