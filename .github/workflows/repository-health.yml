name: Repository Health

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs-health:
    name: Documentation and link health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate i18n, local Markdown links and UTF-8
        run: python scripts/validate_repository_i18n.py
