name: Fehler melden
description: Melde defekte Links, falsche Dokumentation oder ein reproduzierbares Problem in einem GPT-Artefakt.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Hinweis. Bitte poste keine Secrets, Tokens, Passwörter, Kundendaten oder privaten Informationen.
  - type: input
    id: affected-area
    attributes:
      label: Betroffener Bereich
      description: Nenne Ordner oder Datei, zum Beispiel `OpenWebUI Model Builder/systemprompt.md`.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Was ist falsch, unklar oder defekt?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten oder erwartete Information
      description: Was sollte stattdessen passieren oder dokumentiert sein?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduktion oder Beleg
      description: Schritte, Link, Dateiausschnitt oder Screenshot ohne sensible Inhalte.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Sicherheitscheck
      options:
        - label: Ich habe keine Secrets, Tokens, Passwörter, Kundendaten oder personenbezogenen Daten eingefügt.
          required: true
